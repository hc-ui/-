<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes starter</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Cloud Agent 起步应用</p>
        <h1>本地笔记</h1>
        <p class="lede">
          在浏览器里新增一条笔记，确认开发环境、依赖安装和 Web 服务都已就绪。
        </p>
        <p id="health" class="health" aria-live="polite">正在检查服务…</p>
      </header>

      <form id="note-form">
        <label>
          标题
          <input id="title" name="title" maxlength="80" required placeholder="例如：环境已就绪" />
        </label>
        <label>
          内容
          <textarea id="body" name="body" rows="4" placeholder="可选补充"></textarea>
        </label>
        <button type="submit">保存笔记</button>
      </form>

      <section>
        <h2>已保存</h2>
        <ul id="notes" class="notes"></ul>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
